<style>
  :root {
    --bg: #f6f6f3; --panel: #ffffff; --ink: #1d1d1f; --muted: #6b6b72; --line: #a9aab2; --soft-line: #d6d6db;
    --accent: #2f6fde; --accent-soft: #dce8fd; --cur: #2b8a3e; --cur-soft: #d3f9d8; --prev: #9bb7e8;
    --obj: #fff8e6; --obj-line: #d9b24a; --fn: #eef1f6; --arrow: #2f6fde; --bad: #c92a2a;
    --code-bg: #f1f1ee; --out-bg: #ffffff; --out-line: #c9c9cf;
    --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141518; --panel: #1e1f23; --ink: #ececf0; --muted: #9b9ca5; --line: #5a5b63; --soft-line: #3a3b42;
      --accent: #6ea0ff; --accent-soft: #1d3157; --cur: #69db7c; --cur-soft: #1c3a24; --prev: #4a6aa8;
      --obj: #2b2a22; --obj-line: #a8893a; --fn: #2b2e36; --arrow: #6ea0ff; --bad: #ff8787;
      --code-bg: #25262b; --out-bg: #111111; --out-line: #2c2d33; --shadow: 0 1px 3px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141518; --panel: #1e1f23; --ink: #ececf0; --muted: #9b9ca5; --line: #5a5b63; --soft-line: #3a3b42;
    --accent: #6ea0ff; --accent-soft: #1d3157; --cur: #69db7c; --cur-soft: #1c3a24; --prev: #4a6aa8;
    --obj: #2b2a22; --obj-line: #a8893a; --fn: #2b2e36; --arrow: #6ea0ff; --bad: #ff8787;
    --code-bg: #25262b; --out-bg: #111111; --out-line: #2c2d33; --shadow: 0 1px 3px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .mono, code, pre { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  header { max-width: 1280px; margin: 0 auto; padding: 20px 16px 4px; }
  header h1 { margin: 0 0 4px; font-size: 1.5rem; }
  header p { margin: 0; color: var(--muted); }
  .theme-toggle { font: inherit; font-size: .85rem; line-height: 1.2; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; white-space: nowrap; float: right; margin: 0 0 8px 12px; }
  main { max-width: 1280px; margin: 0 auto; padding: 12px 16px 40px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .card { background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; min-width: 0; }
  .card h2 { margin: 0 0 8px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

  /* code */
  .code { background: var(--code-bg); border-radius: 8px; padding: 8px 0; overflow: auto; max-height: 62vh; font-size: 14px; line-height: 1.55; }
  .code .ln { display: flex; white-space: pre; padding-right: 12px; }
  .code .ln .num { width: 3.2em; flex: none; text-align: right; padding-right: .9em; color: var(--muted); user-select: none; }
  .code .ln .mark { width: 1.4em; flex: none; text-align: center; }
  .code .ln.cur { background: var(--cur-soft); }
  .code .ln.cur .mark { color: var(--cur); font-weight: 700; }
  .code .ln.prev .mark { color: var(--prev); }
  .status { margin: 10px 0 0; min-height: 1.5em; font-weight: 600; }
  .status .exc { color: var(--bad); }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .controls button { font: inherit; font-size: .9rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  .controls button.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .controls button:disabled { opacity: .45; cursor: default; }
  .controls input[type=range] { flex: 1 1 140px; min-width: 120px; }
  .counter { color: var(--muted); font-size: .9rem; }
  .keys { color: var(--muted); font-size: .8rem; margin-top: 6px; }

  .output { margin-top: 12px; }
  .output pre { margin: 0; background: var(--out-bg); border: 1px solid var(--out-line); border-radius: 8px; padding: 8px 12px; min-height: 2.4em; white-space: pre-wrap; font-size: 14px; }

  /* frames and objects */
  .mem { position: relative; display: grid; grid-template-columns: minmax(150px, auto) minmax(0, 1fr); gap: 28px; overflow-x: auto; padding-bottom: 6px; }
  .mem svg.arrows { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
  .frames, .heap { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .frame { border-left: 3px solid var(--soft-line); padding: 2px 0 2px 10px; }
  .frame.active { border-left-color: var(--accent); }
  .frame .fname { font-weight: 700; font-size: .9rem; margin-bottom: 2px; }
  table.vars { border-collapse: collapse; font-size: 14px; }
  table.vars td { padding: 3px 8px; border-bottom: 1px solid var(--soft-line); vertical-align: middle; }
  table.vars td.k { text-align: right; color: var(--muted); font-family: ui-monospace, Menlo, Consolas, monospace; }
  table.vars tr.ret td { color: var(--cur); }
  .prim { font-family: ui-monospace, Menlo, Consolas, monospace; white-space: pre; }
  .ptr { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--arrow); vertical-align: middle; }
  .heap-row { display: flex; gap: 34px; align-items: flex-start; }
  .obj { flex: none; }
  .obj .label { font-size: .75rem; color: var(--muted); margin-bottom: 2px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .obj .body { border: 1px solid var(--obj-line); background: var(--obj); border-radius: 6px; font-size: 14px; }
  .obj.fn .body, .obj.cls .body { background: var(--fn); border-color: var(--soft-line); padding: 3px 8px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .cells { display: flex; }
  .cell { min-width: 40px; text-align: center; border-right: 1px solid var(--obj-line); }
  .cell:last-child { border-right: none; }
  .cell .idx { font-size: .7rem; color: var(--muted); border-bottom: 1px solid var(--obj-line); padding: 0 6px; }
  .cell .val { padding: 4px 8px; min-height: 1.9em; }
  .obj table.vars td { border-bottom: 1px solid var(--obj-line); }
  .obj table.vars tr:last-child td { border-bottom: none; }
  .empty { padding: 4px 10px; color: var(--muted); font-style: italic; }
  .note { color: var(--muted); font-size: .85rem; margin-top: 10px; }
  .note a { color: var(--accent); }
</style>

":"prim","v":"-1"}}],"out":"target: 34 , Found at index 2\n","heap":{"1":{"kind":"function","name":"binary_search_recursive(lst, target)"},"2":{"kind":"list","items":[{"t":"prim","v":"21"},{"t":"prim","v":"33"},{"t":"prim","v":"34"},{"t":"prim","v":"56"},{"t":"prim","v":"60"},{"t":"prim","v":"75"},{"t":"prim","v":"77"},{"t":"prim","v":"90"},{"t":"prim","v":"121"},{"t":"prim","v":"130"}]}}},{"line":19,"event":"line","frames":[{"name":"Global frame","vars":[["binary_search_recursive",{"t":"ref","id":1}],["sorted_data",{"t":"ref","id":2}],["target",{"t":"prim","v":"999"}],["result",{"t":"prim","v":"-1"}]]}],"out":"target: 34 , Found at index 2\n","heap":{"1":{"kind":"function","name":"binary_search_recursive(lst, target)"},"2":{"kind":"list","items":[{"t":"prim","v":"21"},{"t":"prim","v":"33"},{"t":"prim","v":"34"},{"t":"prim","v":"56"},{"t":"prim","v":"60"},{"t":"prim","v":"75"},{"t":"prim","v":"77"},{"t":"prim","v":"90"},{"t":"prim","v":"121"},{"t":"prim","v":"130"}]}}},{"line":17,"event":"line","frames":[{"name":"Global frame","vars":[["binary_search_recursive",{"t":"ref","id":1}],["sorted_data",{"t":"ref","id":2}],["target",{"t":"prim","v":"999"}],["result",{"t":"prim","v":"-1"}]]}],"out":"target: 34 , Found at index 2\ntarget: 999 , Not Found\n","heap":{"1":{"kind":"function","name":"binary_search_recursive(lst, target)"},"2":{"kind":"list","items":[{"t":"prim","v":"21"},{"t":"prim","v":"33"},{"t":"prim","v":"34"},{"t":"prim","v":"56"},{"t":"prim","v":"60"},{"t":"prim","v":"75"},{"t":"prim","v":"77"},{"t":"prim","v":"90"},{"t":"prim","v":"121"},{"t":"prim","v":"130"}]}}},{"line":17,"event":"return","frames":[{"name":"Global frame","vars":[["binary_search_recursive",{"t":"ref","id":1}],["sorted_data",{"t":"ref","id":2}],["target",{"t":"prim","v":"999"}],["result",{"t":"prim","v":"-1"}]]}],"out":"target: 34 , Found at index 2\ntarget: 999 , Not Found\n","heap":{"1":{"kind":"function","name":"binary_search_recursive(lst, target)"},"2":{"kind":"list","items":[{"t":"pr <script>
(function () {
  var data = JSON.parse(document.getElementById('trace').textContent);
  var steps = data.steps, lines = data.code.replace(/\n$/, '').split('\n');
  var cur = 0;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }

  // code lines, built once
  $('code').innerHTML = lines.map(function (l, i) {
    return '<div class="ln" data-n="' + (i + 1) + '"><span class="mark"></span><span class="num">' + (i + 1) + '</span><span>' + esc(l) + '</span></div>';
  }).join('');

  function value(v) {
    return v.t === 'prim' ? '<span class="prim">' + esc(v.v) + '</span>'
                          : '<span class="ptr" data-to="' + v.id + '"></span>';
  }
  function children(o) {
    var refs = [];
    (o.items || []).forEach(function (v) { if (v.t === 'ref') refs.push(v.id); });
    (o.attrs || []).forEach(function (kv) { if (kv[1].t === 'ref') refs.push(kv[1].id); });
    (o.pairs || []).forEach(function (kv) { [kv[0], kv[1]].forEach(function (v) { if (v.t === 'ref') refs.push(v.id); }); });
    return refs;
  }
  function objHTML(id, o) {
    var cls = 'obj', label, body;
    if (o.kind === 'list' || o.kind === 'tuple' || o.kind === 'set') {
      label = o.kind;
      body = o.items.length ? '<div class="cells">' + o.items.map(function (v, i) {
        return '<div class="cell"><div class="idx">' + (o.kind === 'set' ? '' : i) + '</div><div class="val">' + value(v) + '</div></div>';
      }).join('') + '</div>' : '<div class="empty">empty ' + o.kind + '</div>';
    } else if (o.kind === 'dict') {
      label = 'dict';
      body = o.pairs.length ? '<table class="vars">' + o.pairs.map(function (kv) {
        return '<tr><td class="k">' + value(kv[0]) + '</td><td>' + value(kv[1]) + '</td></tr>'; }).join('') + '</table>' : '<div class="empty">empty dict</div>';
    } else if (o.kind === 'instance') {
      label = o.cls + ' object';
      body = o.attrs.length ? '<table class="vars">' + o.attrs.map(function (kv) {
        return '<tr><td class="k">' + esc(kv[0]) + '</td><td>' + value(kv[1]) + '</td></tr>'; }).join('') + '</table>' : '<div class="empty">no attributes</div>';
    } else if (o.kind === 'function') {
      cls += ' fn'; label = 'function'; body = esc(o.name);
    } else if (o.kind === 'class') {
      cls += ' cls'; label = 'class'; body = esc(o.name);
    } else {
      label = o.cls || 'object'; body = '<div class="empty">' + esc(o.repr || '') + '</div>';
    }
    return '<div class="' + cls + '" id="obj-' + id + '"><div class="label">' + esc(label) + '</div><div class="body">' + body + '</div></div>';
  }

  function render() {
    var s = steps[cur], prev = cur > 0 ? steps[cur - 1] : null;
    document.querySelectorAll('#code .ln').forEach(function (el) {
      var n = +el.dataset.n, isCur = n === s.line && s.event !== 'end', isPrev = prev && n === prev.line && !isCur;
      el.className = 'ln' + (isCur ? ' cur' : '') + (isPrev ? ' prev' : '');
      el.querySelector('.mark').textContent = isCur ? '➜' : (isPrev ? '➜' : '');
    });
    // keep the current line in view inside the code panel (long programs)
    var curEl = document.querySelector('#code .ln.cur'), codeBox = $('code');
    if (curEl) {
      var cTop = curEl.offsetTop - codeBox.offsetTop, h = codeBox.clientHeight;
      if (cTop < codeBox.scrollTop + 20 || cTop > codeBox.scrollTop + h - 40) codeBox.scrollTop = Math.max(0, cTop - h / 3);
    }
    var top = s.frames[s.frames.length - 1], msg;
    if (s.event === 'call') msg = 'Calling ' + top.name + '(…)';
    else if (s.event === 'return' && top.ret) msg = top.name + ' returns ' + (top.ret.t === 'prim' ? top.ret.v : 'an object');
    else if (s.event === 'exception') msg = '<span class="exc">' + esc(s.exc) + '</span>';
    else if (s.event === 'end') msg = s.exc ? '<span class="exc">Program stopped: ' + esc(s.exc) + '</span>' : 'Program finished.';
    else msg = 'About to run line ' + s.line;
    $('status').innerHTML = msg;
    $('out').textContent = s.out;
    $('counter').textContent = 'Step ' + (cur + 1) + ' of ' + steps.length;
    $('slider').value = cur;
    $('first').disabled = $('back').disabled = cur === 0;
    $('next').disabled = $('last').disabled = cur === steps.length - 1;

    // frames
    $('frames').innerHTML = s.frames.map(function (f, i) {
      var rows = f.vars.map(function (kv) { return '<tr><td class="k">' + esc(kv[0]) + '</td><td>' + value(kv[1]) + '</td></tr>'; }).join('');
      if (f.ret) rows += '<tr class="ret"><td class="k">return</td><td>' + value(f.ret) + '</td></tr>';
      return '<div class="frame' + (i === s.frames.length - 1 ? ' active' : '') + '"><div class="fname">' + esc(f.name) + '</div>' +
             (rows ? '<table class="vars">' + rows + '</table>' : '<div class="empty">no variables yet</div>') + '</div>';
    }).join('');

    // objects: each chain of references runs along one row (like a linked list)
    var heap = s.heap, rows = [], placed = {};
    function place(id, r) {
      if (placed[id] || !heap[id]) return;
      placed[id] = true; rows[r].push(id);
      var kids = children(heap[id]).filter(function (k) { return !placed[k]; });
      kids.forEach(function (k, j) {
        if (j === 0) place(k, r); else { rows.push([]); place(k, rows.length - 1); }
      });
    }
    s.frames.forEach(function (f) {
      f.vars.concat(f.ret ? [['', f.ret]] : []).forEach(function (kv) {
        if (kv[1].t === 'ref' && !placed[kv[1].id]) { rows.push([]); place(kv[1].id, rows.length - 1); }
      });
    });
    $('heap').innerHTML = rows.filter(function (r) { return r.length; }).map(function (r) {
      return '<div class="heap-row">' + r.map(function (id) { return objHTML(id, heap[id]); }).join('') + '</div>';
    }).join('');
    drawArrows();
  }

  function drawArrows() {
    var mem = $('mem'), svg = $('arrows'), box = mem.getBoundingClientRect();
    svg.setAttribute('width', mem.scrollWidth); svg.setAttribute('height', mem.scrollHeight);
    svg.querySelectorAll('path.a').forEach(function (p) { p.remove(); });
    mem.querySelectorAll('.ptr').forEach(function (dot) {
      var target = document.getElementById('obj-' + dot.dataset.to);
      if (!target) return;
      var a = dot.getBoundingClientRect(), b = target.querySelector('.body').getBoundingClientRect();
      var x1 = a.left + a.width / 2 - box.left + mem.scrollLeft, y1 = a.top + a.height / 2 - box.top + mem.scrollTop;
      var x2 = b.left - box.left + mem.scrollLeft, y2 = b.top + Math.min(14, b.height / 2) - box.top + mem.scrollTop;
      if (x2 < x1) { x2 = b.left + 10 - box.left + mem.scrollLeft; y2 = b.top - box.top + mem.scrollTop; }
      var dx = Math.max(30, Math.abs(x2 - x1) / 2);
      var p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      p.setAttribute('class', 'a');
      p.setAttribute('d', 'M' + x1 + ',' + y1 + ' C' + (x1 + dx) + ',' + y1 + ' ' + (x2 - dx) + ',' + y2 + ' ' + x2 + ',' + y2);
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', 'var(--arrow)'); p.setAttribute('stroke-width', '1.6');
      p.setAttribute('marker-end', 'url(#head)');
      svg.appendChild(p);
    });
  }

  function go(i) { cur = Math.max(0, Math.min(steps.length - 1, i)); render(); }
  $('slider').max = steps.length - 1;
  $('first').onclick = function () { go(0); };
  $('back').onclick = function () { go(cur - 1); };
  $('next').onclick = function () { go(cur + 1); };
  $('last').onclick = function () { go(steps.length - 1); };
  $('slider').oninput = function () { go(+this.value); };
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); go(cur - 1); }
  });
  window.addEventListener('resize', drawArrows);
  $('mem').addEventListener('scroll', drawArrows);
  render();

  // light/dark toggle (shared with the notes and the CPSC 100 site)
  var b = $('theme-toggle'), r = document.documentElement;
  function current() { var t = r.getAttribute('data-theme'); return t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); }
  function show() { var dark = current() === 'dark'; b.textContent = dark ? '☀ Light' : '☾ Dark'; b.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode'); }
  b.addEventListener('click', function () { var n = current() === 'dark' ? 'light' : 'dark'; r.setAttribute('data-theme', n); try { localStorage.setItem('cpsc100-theme', n); } catch (e) {} show(); b.blur(); });
  show();
})();
</script>
